# Tests on Windows, where it runs (no cgo there: pure-Go SQLite, the WebView2 window).
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write # Codecov upload by OIDC: no stored token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: check
        shell: bash
        run: bash check.sh
      # Coverage across packages (what one package's tests reach in another
      # counts too), printed here and sent to Codecov.
      - name: coverage
        shell: bash
        run: |
          go test -count=1 -coverpkg=./... -coverprofile=coverage.out ./... > /dev/null
          go tool cover -func=coverage.out | tail -1
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          disable_search: true
          flags: windows
          use_oidc: true
          fail_ci_if_error: false # Codecov being down never blocks a release

  # The same tests on Linux, for the lines only another OS reaches (Codecov
  # merges the two). The release is Windows-only; this is for the figure.
  coverage-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Wails v3 needs GTK 4 and WebKitGTK 6 to build on Linux
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libgtk-4-dev libwebkitgtk-6.0-dev > /dev/null
      - name: coverage
        run: |
          mkdir -p testdata
          go test -count=1 -tags noduckdb -coverpkg=./... -coverprofile=coverage.out ./... > /dev/null
          go tool cover -func=coverage.out | tail -1
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          disable_search: true
          flags: linux
          use_oidc: true
          fail_ci_if_error: false
