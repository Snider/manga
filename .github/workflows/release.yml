# Tag v* → test, build MangaShelf.exe on GitHub's Windows runner, bundle the
# pinned mangadex-dl beside it (checksum-checked), attest, publish a release.
# Verify a download: gh attestation verify MangaShelf.exe -R Snider/manga
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
env:
  MDL_URL: https://github.com/mansuf/mangadex-downloader/releases/download/v3.1.4/mangadex-dl_x64_v3.1.4.zip
  MDL_SHA256: 5c694bd011947dcb89914070718948d111d3f1873b5fef1ddbf00d6a286f5bcd
jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: check
        shell: bash
        run: bash check.sh
      - name: build
        shell: bash
        run: |
          mkdir -p dist/MangaShelf
          CGO_ENABLED=0 go build -trimpath -ldflags "-s -w -H windowsgui" -o dist/MangaShelf/MangaShelf.exe ./cmd/mangashelf
          curl -fsSL "$MDL_URL" -o mdl.zip
          echo "$MDL_SHA256  mdl.zip" | sha256sum -c -
          unzip -q mdl.zip -d dist/MangaShelf
          cp LICENSE dist/MangaShelf/LICENSE.txt
          cat > dist/MangaShelf/README.txt <<TXT
          Manga Shelf ${GITHUB_REF_NAME}: https://github.com/${GITHUB_REPOSITORY}

          Double-click MangaShelf.exe. Your manga go in Documents\Manga
          (change it in Settings). Keep the mangadex-dl folder next to
          MangaShelf.exe: it does the downloading.

          mangadex-dl is mansuf/mangadex-downloader v3.1.4 (MIT,
          https://github.com/mansuf/mangadex-downloader), shipped unchanged:
          its licence is mangadex-dl\LICENSE. Manga Shelf is EUPL-1.2 (LICENSE.txt).
          TXT
          cd dist && powershell -NoProfile -Command "Compress-Archive -Path MangaShelf -DestinationPath MangaShelf-${GITHUB_REF_NAME}-windows-amd64.zip"
          cp MangaShelf/MangaShelf.exe .
          sha256sum MangaShelf.exe MangaShelf-*.zip > SHA256SUMS
          cat SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/MangaShelf.exe
            dist/MangaShelf-*.zip
      - name: release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Built on GitHub's Windows runner from ${GITHUB_SHA}, attested with build provenance."
            echo
            echo "**Download the .zip**, unzip it anywhere (Documents is fine), double-click MangaShelf.exe."
            echo
            echo "- Verify: \`gh attestation verify MangaShelf.exe -R ${GITHUB_REPOSITORY}\`"
            echo
            echo '```'
            cat dist/SHA256SUMS
            echo '```'
          } > notes.md
          pre=""; case "$GITHUB_REF_NAME" in v0.*) pre="--prerelease";; esac
          gh release create "$GITHUB_REF_NAME" $pre --title "Manga Shelf $GITHUB_REF_NAME" --notes-file notes.md \
            dist/MangaShelf-*.zip dist/MangaShelf.exe dist/SHA256SUMS
